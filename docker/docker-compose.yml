# PostgreSQL for local development (and, optionally, the API).
#   docker compose -f docker/docker-compose.yml up -d db            # database only (recommended while developing)
#   docker compose -f docker/docker-compose.yml --profile api up -d # database + API (migrates and seeds on start)
# NOTE: this file was written but NOT run on the machine where the MVP was built (no Docker installed there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: joeat
      POSTGRES_PASSWORD: joeat
      POSTGRES_DB: joeat
    ports: ["5432:5432"]
    volumes: ["joeat_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joeat -d joeat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://joeat:joeat@db:5432/joeat
      ID_HASH_SECRET: change-me
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

volumes:
  joeat_pgdata:
